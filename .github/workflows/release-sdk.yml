name: Release SDK

# Publishes @keyvane/sdk to npm with provenance when a tag like sdk-v0.1.0 is pushed.
# Requires an NPM_TOKEN repository secret with publish access to the @keyvane scope.
on:
  push:
    tags: ['sdk-v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check the tag matches the package version
        run: |
          VERSION=$(node -p "require('./packages/sdk/package.json').version")
          test "sdk-v$VERSION" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $VERSION"; exit 1; }
      - run: npm run build --workspace @keyvane/sdk
      - run: npm publish --workspace @keyvane/sdk --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
